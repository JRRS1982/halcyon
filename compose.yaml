services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3210:3210"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/halcyon?schema=public
      # DIRECT_URL is what `prisma migrate` uses. Without it set here, Prisma
      # falls back to the root .env (Supabase) for the direct connection and
      # migrations run against PRODUCTION. Pin it to the local db service.
      - DIRECT_URL=postgresql://postgres:postgres@db:5432/halcyon?schema=public
      - NODE_ENV=development
      # Cloud Supabase auth creds — the only auth instance (no local Supabase).
      # Compose substitutes these three from the repo-root .env so the seed's
      # admin-create step (and the dev app) can reach auth. Only these cross in;
      # the prod DATABASE_URL in .env never does — it's pinned local above.
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=halcyon
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Provisions halcyon_test + the `test` role on first volume init, so
      # integration (pnpm test:int) and e2e (test:test creds) work out of the
      # box. Runs only when the data dir is empty — see docker/postgres-init.sql.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
