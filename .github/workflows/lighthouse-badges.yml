name: lighthouse badges

# Every deploy status change creates a run; say in the list why most skip.
run-name: >-
  ${{ (github.event_name == 'workflow_dispatch'
       || (github.event.deployment_status.environment == 'Production'
           && github.event.deployment_status.state == 'success'))
      && 'Lighthouse badges → Production'
      || format('Skipped — {0} deploy {1} (badges update only on a Production success)',
                github.event.deployment_status.environment,
                github.event.deployment_status.state) }}

# Lighthouse against production after each successful Production deploy, for
# the README's score badges: the scores change exactly when the site does. It
# reports; it never fails on a low score. Regressions are caught earlier, by
# the `lighthouse` job in ci.yml, on the PR that causes them.
#
# The scores go to a separate `badges` branch, not master: master's ruleset
# only accepts merges whose checks have passed, and a badge is not worth a PR.
# The README reads them through shields.io's endpoint badge.
#
# deployment_status fires for every preview and every state change too (see
# smoke.yml), so the job's `if:` keeps only a Production success.
# `workflow_dispatch` runs it by hand, e.g. to create the branch the first time.
on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      # Mobile, three runs: what PageSpeed Insights leads with.
      # --no-lighthouserc: lhci otherwise finds the repo's lighthouserc.json,
      # which belongs to ci.yml's job and starts a local `pnpm start` server.
      - name: Run Lighthouse on production
        run: >-
          npx -y @lhci/cli@0.15.1 collect
          --no-lighthouserc
          --url=https://www.balanced.money/
          --numberOfRuns=3
          --settings.chromeFlags="--headless=new --no-sandbox"

      - name: Write the badges
        run: |
          git fetch origin badges || true
          if git rev-parse --verify --quiet origin/badges >/dev/null; then
            git worktree add out origin/badges
          else
            git worktree add --detach out
            git -C out checkout --orphan badges
            git -C out rm -rfq .
          fi
          mkdir -p out/lighthouse
          node scripts/lighthouse-badges.mjs .lighthouseci out/lighthouse

      - name: Publish to the badges branch
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lighthouse
          if git diff --cached --quiet; then
            echo "Scores unchanged."
            exit 0
          fi
          git commit -m "Lighthouse scores $(date -u +%F)"
          git push origin HEAD:badges
