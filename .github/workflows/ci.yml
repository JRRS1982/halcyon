name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format check
        run: pnpm check

      - name: Run type check
        run: pnpm typecheck

      - name: Run unit tests with coverage
        run: |
          pnpm test:coverage | tee coverage-output.txt
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          tail -n 10 coverage-output.txt >> $GITHUB_STEP_SUMMARY

  e2e-tests:
    runs-on: ubuntu-latest

    # Authed pages (e.g. the dashboard) server-render Prisma queries, so e2e
    # needs a real Postgres. Credentials match playwright.config.ts's
    # DATABASE_URL (postgresql://test:test@localhost:5432/halcyon_test).
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/halcyon_test
      DIRECT_URL: postgresql://test:test@localhost:5432/halcyon_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up test database
        run: |
          pnpm prisma migrate deploy
          pnpm db:seed

      # E2E tests run against a mock Supabase server (e2e/_mock/supabase.mjs)
      # and a Next.js dev server on port 3100, both started by Playwright's
      # webServer config. The Postgres service above backs the app's Prisma
      # queries (e.g. the dashboard's user-settings lookup); no real Supabase
      # project is touched.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
