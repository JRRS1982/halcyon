name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# GitHub already sets CI=true on every step, so this changes nothing today. It
# is declared because two things here read it and neither should rest on a
# platform default: playwright.config.ts uses it for forbidOnly, and the
# Makefile's e2e-db target skips starting a local Postgres when it is set.
# Keeping the name `CI` rather than something clearer is deliberate — pnpm,
# Next and Playwright all key off that exact name.
env:
  CI: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format check
        run: pnpm check

      - name: Run type check
        run: pnpm typecheck

      - name: Run unit tests with coverage
        # pipefail is required: without it the step's exit code is tee's
        # (always 0), so a jest failure would pass CI silently.
        run: |
          set -o pipefail
          pnpm test:coverage | tee coverage-output.txt
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          tail -n 10 coverage-output.txt >> $GITHUB_STEP_SUMMARY

  # A migration must never ship with the code that uses it. Separation is what
  # makes the deploy order stop mattering: a migration PR changes no
  # application code, so whichever of migrate-prod and the Vercel promotion
  # lands first, schema and code still agree. See src/lib/ci/mixedSchema.ts.
  #
  # PR-only: on a push to master the merge has already happened and there is
  # nothing left to reject.
  #
  # This MUST be on the ruleset's required checks, and since e2e-tests was
  # chained behind it that is load-bearing rather than tidy. A failing check
  # skips e2e-tests, and GitHub counts a skipped required check as satisfied —
  # so without this one required too, a violating PR would be mergeable *and*
  # would never have run the browser suite.
  #
  # Do NOT wire this into migrate-prod with `needs:`, and do not add it to
  # Vercel's Deployment Checks. The two jobs are mutually exclusive by
  # construction, so on master this one is skipped — and a job whose dependency
  # is skipped is skipped as well. migrate-prod would quietly stop running while
  # a skipped check satisfied both gates, which is the September 2026 outage
  # rebuilt out of the guard meant to prevent it.
  mixed-schema-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        # Full history: the check diffs against the merge base, which a shallow
        # clone does not contain.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration/code separation
        env:
          ALLOW_MIXED_SCHEMA: ${{ contains(github.event.pull_request.labels.*.name, 'mixed-schema-ok') }}
        run: pnpm check:mixed-schema "origin/${{ github.base_ref }}"

  # Deliberately excluded from BOTH gates: the `master` ruleset's required
  # checks, and Vercel's Deployment Checks. A red audit means a new advisory
  # landed against the lockfile, not that this PR is wrong, so it must never
  # block a merge or a release. Keep it green when you can — scoped overrides
  # in pnpm-workspace.yaml — but treat it as a signal, not a gate.
  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the build only on high/critical advisories. Low/moderate
      # transitive issues are reported in the log but don't block a merge.
      # Dependabot (.github/dependabot.yml) handles routine version bumps.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Behind the cheap gate, for the same reason as e2e-tests, and with the same
    # mandatory guard — a skipped dependency skips its dependents by default,
    # and mixed-schema-check is skipped on every push to master.
    #
    # Free in wall-clock terms: e2e-tests is the critical path at ~14 minutes, so
    # delaying a ~5 minute job by the gate's ~30 seconds changes nothing for a
    # PR that passes. lint-and-test deliberately stays unchained — it is the
    # fastest job and the likeliest to fail, so it should always report.
    needs: [mixed-schema-check]
    if: ${{ !cancelled() && needs.mixed-schema-check.result != 'failure' }}

    # Server-action integration tests run against a real Postgres (halcyon_test).
    # The postgres/postgres credentials + db name match the test:int script's
    # hard-pinned DATABASE_URL; globalSetup applies migrations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halcyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:int

  e2e-tests:
    runs-on: ubuntu-latest

    # Chained behind mixed-schema-check so a PR that mixes a migration with code
    # does not burn ~13 minutes of browser tests before being rejected.
    #
    # The explicit condition is NOT optional. By default a job whose dependency
    # was *skipped* is skipped too, and mixed-schema-check is skipped on every
    # push to master (it is PR-only) — which would take e2e-tests with it, and
    # then migrate-prod, which needs e2e-tests. Releases would silently stop
    # migrating. So: run unless the check actually failed.
    needs: [mixed-schema-check]
    if: ${{ !cancelled() && needs.mixed-schema-check.result != 'failure' }}
    # The official Playwright image, pinned to the version in pnpm-lock.yaml —
    # the two must move together, since the browsers are baked in and Playwright
    # refuses to drive a build it wasn't shipped with.
    #
    # This exists to delete a failure mode rather than to save time. Installing
    # browsers on a bare runner means `--with-deps`, which means `apt-get`, and
    # on 2026-08-19 a degraded Ubuntu mirror made that step take 16-24 minutes
    # on five separate runs across four PRs — sometimes hanging outright,
    # sometimes finishing so late the suite was killed mid-run. The image ships
    # the browsers and every system library they need, so there is no apt call
    # left to be slow.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    # A wedged runner once sat for GitHub's 6h default before being killed, so
    # this stays bounded; the suite itself takes ~11 minutes.
    timeout-minutes: 30

    # Authed pages (e.g. the dashboard) server-render Prisma queries, so e2e
    # needs a real Postgres.
    #
    # The host is the *service name*, not localhost: this job runs inside a
    # container, so the database is a sibling container on the job's network
    # rather than a port on the runner.
    #
    # Three programs read three different variable names, and in production
    # they hold three different values:
    #
    #   DATABASE_URL      the app (src/lib/env.ts) — playwright.config passes
    #                     it to the Next server it spawns. Pooled (6543) in prod.
    #   DIRECT_URL        prisma.config.ts, for `migrate deploy`. Direct (5432)
    #                     in prod, because migrations cannot use the pooler.
    #   E2E_DATABASE_URL  the specs' own Prisma client. Quarantined on purpose:
    #                     e2e/_helpers/fixtures.ts refuses to read DATABASE_URL
    #                     so a production value can never reach its TRUNCATE.
    #
    # Here they all address the one disposable CI database, so the URL is
    # written once and the other two are derived from it on the steps that need
    # them. Job-level `env` entries cannot reference each other, but step-level
    # ones can read the `env` context — which is why the derivation lives down
    # in the steps rather than up here.
    env:
      DATABASE_URL: postgresql://test:test@postgres:5432/halcyon_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only apply the schema — do NOT run `pnpm db:seed`. That seed is a
      # local-dev tool (it provisions a loginable demo user via the cloud
      # Supabase admin API, which CI has no creds for). The e2e specs manage
      # their own data: they sign in as the mock auth user, let the app upsert
      # the User/UserSettings rows on first request, then create accounts,
      # categories and transactions through the UI per test.
      - name: Apply migrations to test database
        env:
          DIRECT_URL: ${{ env.DATABASE_URL }}
        run: pnpm prisma migrate deploy

      # E2E tests run against a mock Supabase server (e2e/_mock/supabase.mjs)
      # and a Next.js dev server on port 3100, both started by Playwright's
      # webServer config. The Postgres service above backs the app's Prisma
      # queries (e.g. the dashboard's user-settings lookup); no real Supabase
      # project is touched.
      - name: Run E2E tests
        env:
          E2E_DATABASE_URL: ${{ env.DATABASE_URL }}
          # Firefox refuses to start when $HOME belongs to someone else, and in
          # a container job that is exactly the situation: the step runs as
          # root while $HOME is /github/home, owned by the image's pwuser.
          # ("Running Nightly as root in a regular user's session is not
          # supported.") Playwright's own error text prescribes this variable.
          # Scoped to this step so the rest of the job keeps the HOME that
          # actions/setup-node and pnpm set their caches up against.
          HOME: /root
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Applies pending Prisma migrations to the production Supabase database.
  # Runs only on push to master (never on PRs) and only after lint/test,
  # integration and e2e pass, so prod schema changes are gated on a green build.
  #
  # Ordering against the deploy is enforced in Vercel, not here. Vercel
  # promotes a production deployment only once its Deployment Checks pass, and
  # this job is on that list (with lint-and-test, integration-tests and
  # e2e-tests) — so a failed migration leaves prod on old code AND old schema,
  # which is the consistent state. That list lives in the Vercel dashboard;
  # changing it changes the release guarantee.
  #
  # Belt and braces: the mixed-schema-check job above keeps migrations out of code
  # PRs entirely, so the two halves rarely move together in the first place.
  #
  # Host-agnostic: the deploy platform runs no migrations itself.
  migrate-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-test, integration-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      # Unpooled Supabase connection (port 5432). migrate deploy must use the
      # direct URL, not the pooled 6543 one. Prisma reads DATABASE_URL too, so
      # point both at the direct URL for this job.
      DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to production
        run: pnpm prisma migrate deploy
