name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# GitHub already sets CI=true on every step, so this changes nothing today. It
# is declared because two things here read it and neither should rest on a
# platform default: playwright.config.ts uses it for forbidOnly, and the
# Makefile's e2e-db target skips starting a local Postgres when it is set.
# Keeping the name `CI` rather than something clearer is deliberate — pnpm,
# Next and Playwright all key off that exact name.
env:
  CI: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format check
        run: pnpm check

      - name: Run type check
        run: pnpm typecheck

      - name: Run unit tests with coverage
        # pipefail is required: without it the step's exit code is tee's
        # (always 0), so a jest failure would pass CI silently.
        run: |
          set -o pipefail
          pnpm test:coverage | tee coverage-output.txt
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          tail -n 10 coverage-output.txt >> $GITHUB_STEP_SUMMARY

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail the build only on high/critical advisories. Low/moderate
      # transitive issues are reported in the log but don't block a merge.
      # Dependabot (.github/dependabot.yml) handles routine version bumps.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Server-action integration tests run against a real Postgres (halcyon_test).
    # The postgres/postgres credentials + db name match the test:int script's
    # hard-pinned DATABASE_URL; globalSetup applies migrations.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: halcyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration tests
        run: pnpm test:int

  e2e-tests:
    runs-on: ubuntu-latest
    # A wedged runner once sat for GitHub's 6h default before being killed;
    # a healthy run takes ~11 minutes. The headroom over that is deliberate:
    # `timeout-minutes` covers the whole job, so when setup is slow it eats the
    # budget the tests need. On 2026-08-19 a degraded apt mirror made browser
    # installation take 16m47s, leaving 7 minutes for a 246-test suite and
    # killing it mid-run — which GitHub then reports as `cancelled`, reading
    # exactly like a test failure. The install step now has its own, tighter
    # timeout below so that failure surfaces as itself.
    timeout-minutes: 35

    # Authed pages (e.g. the dashboard) server-render Prisma queries, so e2e
    # needs a real Postgres. Credentials match playwright.config.ts's
    # DATABASE_URL (postgresql://test:test@localhost:5432/halcyon_test).
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/halcyon_test
      DIRECT_URL: postgresql://test:test@localhost:5432/halcyon_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: halcyon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser binaries are ~500MB across the three engines and change
      # only when the Playwright dependency does, so key the cache on the
      # lockfile. A hit turns the step below into a no-op download.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        # All three engines run in CI (chromium + firefox + webkit); --with-deps
        # also installs the required system libraries. Run unconditionally even
        # on a cache hit: the browsers are then already present (so this is
        # quick), but the apt-installed system libraries are not — they live in
        # /usr/lib on the runner image, which is not cached.
        #
        # Its own timeout, well above the ~2-3 minutes this takes when healthy:
        # the apt step here is the single flakiest part of CI (a dead Ubuntu
        # mirror has hung it for 24 minutes), and without a step-level bound a
        # hang is silently charged to the test run instead of being reported as
        # what it is.
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps

      # Only apply the schema — do NOT run `pnpm db:seed`. That seed is a
      # local-dev tool (it provisions a loginable demo user via the cloud
      # Supabase admin API, which CI has no creds for). The e2e specs manage
      # their own data: they sign in as the mock auth user, let the app upsert
      # the User/UserSettings rows on first request, then create accounts,
      # categories and transactions through the UI per test.
      - name: Apply migrations to test database
        run: pnpm prisma migrate deploy

      # E2E tests run against a mock Supabase server (e2e/_mock/supabase.mjs)
      # and a Next.js dev server on port 3100, both started by Playwright's
      # webServer config. The Postgres service above backs the app's Prisma
      # queries (e.g. the dashboard's user-settings lookup); no real Supabase
      # project is touched.
      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Applies pending Prisma migrations to the production Supabase database.
  # Runs only on push to master (never on PRs) and only after lint/test and
  # e2e pass, so prod schema changes are gated on a green build. Vercel is
  # configured to wait for this workflow before deploying, so the new code
  # never goes live against an un-migrated schema. Host-agnostic: the deploy
  # platform runs no migrations itself.
  migrate-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-test, integration-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    env:
      # Unpooled Supabase connection (port 5432). migrate deploy must use the
      # direct URL, not the pooled 6543 one. Prisma reads DATABASE_URL too, so
      # point both at the direct URL for this job.
      DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations to production
        run: pnpm prisma migrate deploy
