# Post-deployment smoke test: runs against production after Vercel has
# promoted a build, and proves the thing users hit is serving and can reach
# its database. See docs/features/release-flow.md.
#
# Triggered by deployment_status rather than by the end of ci.yml, because the
# end of CI is not the end of the release: Vercel deploys independently and
# promotes on its own Deployment Checks. This event is the only signal that
# the deployed thing has actually changed.
#
# That event fires for EVERY deployment status change — each preview build,
# each pending/success transition — and GitHub offers no trigger-level filter
# on environment. So a run record is created for all of them and the job's
# `if:` skips the ones that are not a Production success. Nothing executes for
# a skipped row (no runner is assigned), but the row exists; run-name below
# makes it say why, since a skipped job cannot write a summary.
name: Post-deploy smoke test

# The title in the Actions list. Meaning first, sha last, so a real run reads
# "Post-deploy smoke → Production · <sha>" and a skipped one explains itself
# without being opened. (Expressions cannot shorten the sha; the job summary
# prints the 7-char form.)
run-name: >-
  ${{ (github.event.deployment_status.environment == 'Production'
       && github.event.deployment_status.state == 'success')
      && format('Post-deploy smoke → Production · {0}', github.event.deployment.sha)
      || format('Skipped — {0} deploy {1} (smoke runs only when a Production deploy succeeds)',
                github.event.deployment_status.environment,
                github.event.deployment_status.state) }}

on: deployment_status

jobs:
  smoke:
    # Both conditions are load-bearing. `success` skips the pending and failed
    # transitions. The environment filter is not optional: this event also
    # fires for every preview deployment, so without it each PR would
    # smoke-test itself against a preview URL.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same pinned image as the e2e job, for the same reason: the browsers are
    # baked in, so there is no apt call left to be slow or to hang.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-noble

    steps:
      # Pinned to the deployed commit, not the branch tip. A rollback or a
      # redeploy promotes an older commit, and the spec that shipped with it is
      # the one that should judge it.
      - name: Checkout the deployed commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}

      - name: Say which deployment is under test
        env:
          SHA: ${{ github.event.deployment.sha }}
        run: |
          {
            echo "### Post-deploy smoke test"
            echo
            echo "Runs after Vercel promotes a build to **Production**, against the public alias, to prove the deployed app is serving and can reach its database."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${SHA:0:7}\` — $(git log -1 --pretty=%s) |"
            echo "| Probing | https://www.balanced.money |"
            echo "| Vercel deployment | ${{ github.event.deployment.id }} (${{ github.event.deployment_status.target_url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No database, no Supabase, no app server. Everything under test is
      # already running at SMOKE_BASE_URL, and every assertion is
      # unauthenticated and read-only — nothing here may write to production.
      - name: Run smoke tests
        env:
          # The production ALIAS, not deployment_status.target_url. That URL is
          # the raw *.vercel.app deployment address, which sits behind Vercel
          # Deployment Protection: every request gets a 302 to Vercel's SSO and
          # an HTML interstitial, so the first real run (619c7df) tested the
          # login wall and never reached the app. The alias is public, and by
          # the time state == success it points at exactly this deployment.
          SMOKE_BASE_URL: https://www.balanced.money
          # /api/health is bearer-gated. Must match Vercel's CRON_SECRET env
          # var; health.yml reads the same secret. If it is unset the probe
          # gets a 401, and the spec says so rather than reporting an outage.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Firefox aside, the same HOME fix the e2e job needs: the step runs as
          # root in a container whose $HOME belongs to the image's pwuser.
          HOME: /root
        run: pnpm test:smoke

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7
