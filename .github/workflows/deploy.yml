name: Deploy (On Home Server)

on:
  workflow_dispatch:    # Allow manual deployment via GitHub UI
  workflow_run:
    workflows: ["CI"]   # Trigger after CI workflow completes
    types:
      - success         # Run only when CI succeeds
    branches: [master]  # Only on master branch

concurrency:
  group: deploy-home
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Docker Compose (prod)
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose -f compose.prod.yaml up -d --build --remove-orphans

      - name: Run database migrations
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          docker compose -f compose.prod.yaml exec -T -e HOME=/tmp app pnpm exec prisma migrate deploy