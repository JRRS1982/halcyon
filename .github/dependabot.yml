# Dependabot version-update PRs. (Security alerts are a separate feature,
# enabled in the repo's Settings -> Code security, and need no config here.)
# Grouped + weekly to keep PR noise low for a solo project.
version: 2
updates:
  - package-ecosystem: "npm" # reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per week for all non-major bumps; majors stay individual so
      # breaking changes are reviewed on their own.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions" # keeps actions/* in ci.yml current
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
