# Dependabot version-update PRs. (Security alerts are a separate feature,
# enabled in the repo's Settings -> Code security, and need no config here.
# Those bypass `cooldown` below, so real CVEs still surface immediately.)
# Grouped + monthly to keep PR noise low for a solo project.
#
# `cooldown` also keeps Dependabot from proposing a version that pnpm will then
# refuse to install: pnpm 11 enforces a 24h minimumReleaseAge, so a package
# published the same morning fails every job at "Install dependencies"
# (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION). The floors here are well clear of it.
version: 2
updates:
  - package-ecosystem: "npm" # reads pnpm-lock.yaml
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR per month for all non-major bumps; majors stay individual so
      # breaking changes are reviewed on their own.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions" # keeps actions/* in ci.yml current
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
